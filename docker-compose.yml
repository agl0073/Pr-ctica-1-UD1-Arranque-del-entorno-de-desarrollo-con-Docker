services:
  # Contenedor 1: Servidor web Nginx (puerto 8080 en host -> 80 en contenedor)
  web:
    image: nginx:alpine
    container_name: web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  # Contenedor 2: Intérprete PHP 8.3 con PHP-FPM y extensión pdo_mysql
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dwes_db
      DB_USER: daw_user
      DB_PASSWORD: daw_password
    depends_on:
      - db
    networks:
      - app-network

  # Contenedor 3: Base de datos relacional MySQL 8.0
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dwes_db
      MYSQL_USER: daw_user
      MYSQL_PASSWORD: daw_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

# Volumen persistente para almacenar la base de datos de MySQL
volumes:
  db_data:

# Red puente interna para la comunicación entre los tres contenedores
networks:
  app-network:
    driver: bridge
