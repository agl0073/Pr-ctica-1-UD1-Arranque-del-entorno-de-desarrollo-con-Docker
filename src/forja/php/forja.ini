; =====================================================================
;  php/forja.ini · Directivas de TU entorno de desarrollo      [CE 2.f]
;  Autor: Alejandro Segundo Ganoza Leiro · Variante: C · Pícara
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo: docker compose restart php
; =====================================================================

; 1. display_errors
; QUÉ HACE: Determina si los errores y excepciones se imprimen en la salida web del navegador.
; POR QUÉ: Se activa (On) durante el desarrollo para detectar y corregir fallos al instante. En producción debe estar en Off por seguridad.
display_errors = On

; 2. error_reporting
; QUÉ HACE: Establece el nivel de sensibilidad del reporte de errores de PHP.
; POR QUÉ: Se fija en E_ALL para que PHP notifique cualquier discrepancia, aviso o función obsoleta, asegurando la máxima calidad del código.
error_reporting = E_ALL

; 3. date.timezone
; QUÉ HACE: Define la zona horaria predeterminada para las funciones de fecha y hora (date, time, etc.).
; POR QUÉ: Se establece en Europe/Madrid para que la hora de las crónicas y registros coincida exactamente con la hora local de la estación y del aula.
date.timezone = Europe/Madrid

; 4. short_open_tag
; QUÉ HACE: Habilita el reconocimiento de las etiquetas cortas de apertura de PHP (<?).
; POR QUÉ: Se mantiene en On para garantizar compatibilidad con sintaxis abreviada (recordando que <?= siempre está disponible por estándar).
short_open_tag = On

; 5. expose_php
; QUÉ HACE: Decide si el servidor envía la cabecera HTTP "X-Powered-By: PHP/x.x" en cada respuesta.
; POR QUÉ: Se desactiva (Off) por buenas prácticas de seguridad (hardening), evitando divulgar al exterior la versión del intérprete.
expose_php = Off

; 6. memory_limit
; QUÉ HACE: Establece la cantidad máxima de memoria RAM que un script de PHP tiene permitido reservar.
; POR QUÉ: Se asigna 256M para garantizar un margen amplio de procesamiento de datos y plantillas dinámicas sin agotar la memoria asignada.
memory_limit = 256M
